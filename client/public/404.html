<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… | Dev Yeasin</title>
    <script>
      try {
        sessionStorage.setItem("dev-yeasin-github-pages-route", window.location.href);
      } catch {}
      // A unique root query avoids a stale cached index.html loading an older route map.
      // main.tsx restores the saved path and removes this temporary query before React renders.
      window.location.replace(`/?github-pages-route=${Date.now()}`);
    </script>
  </head>
  <body>
    <p>Redirecting to Dev Yeasin’s portfolio…</p>
  </body>
</html>
